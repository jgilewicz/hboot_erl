# @package algorithm
# Unified ERL Configuration: supports full ERL, prefix h, h-bootstrap,
# Q-critic surrogate (random / always), ensemble critic, and SEMARL TD-error gate.
name: erl

horizon: 1000
async_env: true

# Population (CEM over ActorHead's flat params, evaluated on Z(s))
pop_size: 10
embedding_dim: 256
sigma_init: 1e-3
damp: 1e-3
damp_limit: 1e-5
elitism: true

# TD3 gradient agent
critic_hidden_dims: [400, 300]
gamma: 0.99
tau: 0.005
policy_noise: 0.2
noise_clip: 0.5
policy_freq: 2
exploration_noise: 0.1
actor_lr: 1e-3
critic_lr: 1e-3
batch_size: 256
buffer_capacity: 1_000_000
warmup_steps: 10_000
train_ratio: 1.0

# EA <-> RL gene flow
rl_to_ea_sync_period: 5
ea_tau: 0.005

# Evaluation Mode: full | prefix | prefix_random | hboot | sc_erl_random | sc_erl_always | ensemble | semarl_td
eval_mode: full
prefix_steps: null
prefix_grid: [100, 200, 400, 600, 800]

# Gated Surrogate Parameters
omega: 0.79
k_ensembles: 5
surrogate_batch: 1024
epsilon: 0.142
mad_k: 2.483
beta: 0.432
beta_lr: 1e-3

# SEMARL Adaptive TD-error Gate: p_surr(delta) = clip(alpha * exp(-beta * delta_ema), p_min, p_max)
semarl_alpha: 1.0
semarl_beta: 1.0
semarl_p_min: 0.0
semarl_p_max: 0.9
semarl_ema_decay: 0.1

shadow_interval: 10
