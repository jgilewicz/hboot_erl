name = "prefix-v1"
question = "Can an equal short prefix (h=200, b=0.2) replace the critic surrogate in SC-ERL on HalfCheetah-v5 without myopia (elite_overlap >= 0.75)?"

envs = ["HalfCheetah-v5"]
conditions = ["erl", "sc_erl-random", "prefix-h200", "prefix-h100"]
seeds = [0, 1, 2]
total_steps = 1_000_000

[wandb]
entity = "evo_rl"
project = "triage_erl"
tag = "prefix-v1"
run_name = '^(?P<condition>.+)_(?P<env>[^_]+)_s(?P<seed>\d+)$'

[metric]
keys = ["perf/eval_rl", "eval_reward"]
x = ["env_steps", "total_steps"]
label = "eval return"
final_window = 0.1

[reference]
condition = "erl"
thresholds = [0.25, 0.5, 0.75, 0.9]

[[comparisons]]
a = "prefix-h200"
b = "sc_erl-random"
question = "Equal prefix h=200 (b=0.2) vs random critic gate (omega=0.79) at equal step budget"

[[comparisons]]
a = "prefix-h200"
b = "erl"
question = "Equal prefix h=200 vs full-horizon ERL (theta=1.0)"

[[comparisons]]
a = "prefix-h100"
b = "sc_erl-random"
question = "Shorter prefix h=100 (b=0.1) vs random critic gate (omega=0.79)"

[preregistration]
primary_env = "HalfCheetah-v5"
primary = "final-window perf/eval_rl of prefix-h200 vs sc_erl-random across seeds 0..2, plus shadow select/elite_overlap (independent full-horizon episode every 10 generations)"
go = "prefix-h200 >= sc_erl-random in final-window perf/eval_rl on >= 3/3 seeds, and shadow select/elite_overlap does not drop below 0.75"
no_go = "close short-prefix replacement of the critic"
report_only = ["prefix-h100 vs sc_erl-random and prefix-h200", "select/rank_corr_surr over env_steps", "speed to threshold vs erl"]

[[secondary]]
key = "cost/real_frac"
label = "real_frac"
note = "share of horizon evaluated per individual; 0.2 for h=200, 0.1 for h=100"

[[secondary]]
key = "select/elite_overlap"
label = "elite overlap (shadow)"
note = "overlap with independent H=1000 truth (every 10 gens in prefix); criterion >= 0.75"

[[secondary]]
key = "select/rank_corr_surr"
label = "rank corr (shadow)"
note = "Spearman vs independent H=1000 truth"

[[secondary]]
key = "screen/cem_std"
label = "cem_std"
note = "mean CEM parameter std"

[cluster]
ssh_host = "wcss"

[[cluster.jobs]]
id = 6235563
label = "HalfCheetah-v5 (erl)"

[[cluster.jobs]]
id = 6235564
label = "HalfCheetah-v5 (sc_erl-random, prefix-h200, prefix-h100)"

[report]
url = ""

