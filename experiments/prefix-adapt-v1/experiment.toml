name = "prefix-adapt-v1"
question = "Does adaptive prefix h in {50, 100, 200, 400, 1000} match the best fixed h within 3% on HalfCheetah-v5 and Hopper-v5, and does prefix-h200 generalize to Hopper-v5?"

envs = ["HalfCheetah-v5", "Hopper-v5"]
conditions = ["erl", "sc_erl-random", "prefix-h200", "prefix-h100", "prefix-adapt"]
seeds = [0, 1, 2]
total_steps = 1_000_000

[wandb]
entity = "evo_rl"
project = "triage_erl"
tag = "prefix-adapt-v1"
run_name = '^(?P<condition>.+)_(?P<env>[^_]+)_s(?P<seed>\d+)$'

[metric]
keys = ["perf/eval_rl", "eval_reward"]
x = ["env_steps", "total_steps"]
label = "eval return"
final_window = 0.1

[reference]
condition = "erl"
thresholds = [0.25, 0.5, 0.75, 0.9]

[[comparisons]]
a = "prefix-adapt"
b = "prefix-h200"
question = "Adaptive h vs fixed h=200 across HalfCheetah-v5 and Hopper-v5"

[[comparisons]]
a = "prefix-adapt"
b = "prefix-h100"
question = "Adaptive h vs fixed h=100 across HalfCheetah-v5 and Hopper-v5"

[[comparisons]]
a = "prefix-adapt"
b = "sc_erl-random"
question = "Adaptive h vs random critic gate (omega=0.79)"

[[comparisons]]
a = "prefix-h200"
b = "sc_erl-random"
question = "Fixed prefix h=200 (b=0.2) vs random critic gate (omega=0.79) on HalfCheetah-v5 and Hopper-v5"

[[comparisons]]
a = "prefix-h200"
b = "erl"
question = "Fixed prefix h=200 vs full-horizon ERL (theta=1.0)"

[preregistration]
primary_env = "Hopper-v5"
primary = "final-window perf/eval_rl of prefix-adapt vs max(prefix-h100, prefix-h200) on HalfCheetah-v5 and Hopper-v5 across seeds 0..2, plus prefix-h200 vs sc_erl-random on Hopper-v5"
go = "prefix-adapt >= best fixed h - 3% of final-window perf/eval_rl in both HalfCheetah-v5 and Hopper-v5 on >= 2/3 seeds"
no_go = "keep fixed h=200 if prefix-adapt falls > 3% below best fixed h in >= 2/3 seeds"
report_only = ["which h values prefix-adapt selects on HalfCheetah-v5 vs Hopper-v5 over training", "Hopper-v5 generalization: whether prefix-h200 still beats sc_erl-random", "calibration step overhead adapt/cal_steps and cost/real_frac"]

[[secondary]]
key = "adapt/h"
label = "adaptive h"
note = "selected prefix length h in {50, 100, 200, 400, 1000}"

[[secondary]]
key = "adapt/r_h"
label = "r(h)"
note = "normalized rank agreement r(h) = spearman(prefix_h, full) / ceiling at active h"

[[secondary]]
key = "adapt/ceiling"
label = "noise ceiling"
note = "spearman(full_a, full_b) refreshed on calibration 0 and every 5th calibration"

[[secondary]]
key = "adapt/cal_steps"
label = "calibration overhead (steps)"
note = "cumulative env_steps spent on calibration rollouts beyond current_h"

[[secondary]]
key = "cost/real_frac"
label = "real_frac"
note = "effective population evaluation cost per generation relative to 1 full episode"

[[secondary]]
key = "select/elite_overlap"
label = "elite overlap (shadow)"
note = "overlap with independent H=1000 truth"

[cluster]
ssh_host = "wcss"

[report]
url = ""
