name = "screen-loop-v1"
question = "Does 4x CEM oversampling with critic-mu pre-screening (40 -> 10 at sigma x1) beat standard ERL at equal environment-step cost?"

envs = ["HalfCheetah-v5", "dog-stand"]
conditions = ["erl", "erl-screen"]
seeds = [0, 1, 2]
total_steps = 1_000_000

[wandb]
entity = "evo_rl"
project = "triage_erl"
tag = "screen-loop-v1"
run_name = '^(?P<condition>.+)_(?P<env>[^_]+)_s(?P<seed>\d+)$'

[metric]
keys = ["perf/eval_rl", "eval_reward"]
x = ["env_steps", "total_steps"]
label = "eval return"
final_window = 0.1

[reference]
condition = "erl"
thresholds = [0.25, 0.5, 0.75, 0.9]

[[comparisons]]
a = "erl-screen"
b = "erl"
question = "4x oversampled mu-screened ERL (40 -> 10) vs standard ERL (theta=1.0)"

[preregistration]
primary_env = "HalfCheetah-v5"
primary = "final-window perf/eval_rl of erl-screen vs erl on HalfCheetah-v5 across seeds 0..2"
go = "erl-screen > erl in final-window perf/eval_rl on >= 3/3 seeds on HalfCheetah-v5"
no_go = "close in-loop mu pre-screening"
report_only = [
  "dog-stand perf/eval_rl (weak signal in screen-v1 probe)",
  "screen/mean_gain (truth of mu-selected 10 minus truth of random 10, every 10 gens)",
  "screen/elite_gain (top-5 truth of mu-selected 10 minus top-5 truth of random 10, every 10 gens)",
  "screen/cem_std over env_steps",
  "screen/overlap_top10 and screen/rank_corr",
]

[[secondary]]
key = "screen/mean_gain"
label = "mean gain (10 of 40)"
note = "shadow truth of mu-selected 10 minus random 10 (every 10 gens)"

[[secondary]]
key = "screen/elite_gain"
label = "elite gain (top-5 of 10)"
note = "shadow top-5 truth of mu-selected 10 minus random 10 (every 10 gens)"

[[secondary]]
key = "screen/cem_std"
label = "cem_std"
note = "mean CEM parameter std"

[[secondary]]
key = "screen/overlap_top10"
label = "top-10 overlap"
note = "share of true top-10 of 40 selected by mu; chance 0.25"

[[secondary]]
key = "screen/rank_corr"
label = "rank corr (40)"
note = "Spearman(mu, truth) across all 40 candidates"

[cluster]
ssh_host = "wcss"

[report]
url = ""

